{{ define "transcript" }}
{{- $collapsible := gt (len .) 10 }}
<div id="transcript"{{ if $collapsible }} class="fade"{{ end }}>
    {{ range $idx, $elm := . }}
    {{ if eq $idx 10 }}
        </div>
        <div id="more" class="slide">
    {{ end }}
        {{ $elm | safeHTML }}
    {{ end }}
</div>
{{ if $collapsible }}
<a href="#" onclick="toggleVisibility(); return false;" role="button" id="moreBtn">Mehr lesen</a>
{{ end }}
{{ end }}
